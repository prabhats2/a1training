<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Certificate Background -->
    <rect width="800" height="600" fill="#ffffff"/>
    <rect x="20" y="20" width="760" height="560" fill="none" stroke="#8e44ad" stroke-width="4"/>
    
    <!-- Certificate Header -->
    <text x="400" y="100" text-anchor="middle" font-family="Arial" font-size="40" font-weight="bold" fill="#2c3e50">
        Certificate of Completion
    </text>
    
    <!-- DevOps Logo -->
    <g transform="translate(400,200)">
        <circle cx="0" cy="0" r="60" fill="#8e44ad"/>
        <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="24" fill="white">DevOps</text>
    </g>
    
    <!-- Certificate Text -->
    <text x="400" y="350" text-anchor="middle" font-family="Arial" font-size="24" fill="#2c3e50">
        This is to certify that
    </text>
    
    <!-- Name Placeholder -->
    <line x1="250" y1="400" x2="550" y2="400" stroke="#34495e" stroke-width="2"/>
    <text x="400" y="430" text-anchor="middle" font-family="Arial" font-size="18" fill="#7f8c8d">
        Name of Student
    </text>
    
    <!-- Course Details -->
    <text x="400" y="480" text-anchor="middle" font-family="Arial" font-size="20" fill="#2c3e50">
        has successfully completed the DevOps Engineering Course
    </text>
    
    <!-- Decorative Elements -->
    <circle cx="100" cy="100" r="40" fill="none" stroke="#8e44ad" stroke-width="2"/>
    <circle cx="700" cy="100" r="40" fill="none" stroke="#8e44ad" stroke-width="2"/>
    <circle cx="100" cy="500" r="40" fill="none" stroke="#8e44ad" stroke-width="2"/>
    <circle cx="700" cy="500" r="40" fill="none" stroke="#8e44ad" stroke-width="2"/>
</svg>
