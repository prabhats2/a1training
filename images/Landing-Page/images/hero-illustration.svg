<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Circle -->
    <circle cx="500" cy="300" r="300" fill="#f0f4f8" opacity="0.5"/>
    
    <!-- DevOps Infinity Loop -->
    <path d="M300,300 C300,250 350,200 400,200 C450,200 500,250 500,300 C500,350 450,400 400,400 C350,400 300,350 300,300" 
          fill="none" stroke="#0066cc" stroke-width="8"/>
    <path d="M500,300 C500,250 550,200 600,200 C650,200 700,250 700,300 C700,350 650,400 600,400 C550,400 500,350 500,300" 
          fill="none" stroke="#8e44ad" stroke-width="8"/>
    
    <!-- Dev Icon -->
    <rect x="350" y="150" width="100" height="60" rx="10" fill="#2ecc71"/>
    <text x="400" y="190" text-anchor="middle" fill="white" font-family="Arial" font-size="20">DEV</text>
    
    <!-- Ops Icon -->
    <rect x="550" y="150" width="100" height="60" rx="10" fill="#e74c3c"/>
    <text x="600" y="190" text-anchor="middle" fill="white" font-family="Arial" font-size="20">OPS</text>
    
    <!-- Connection Lines -->
    <line x1="400" y1="210" x2="400" y2="250" stroke="#2ecc71" stroke-width="3"/>
    <line x1="600" y1="210" x2="600" y2="250" stroke="#e74c3c" stroke-width="3"/>
    
    <!-- Circular Icons -->
    <circle cx="400" cy="300" r="30" fill="#3498db"/>
    <text x="400" y="308" text-anchor="middle" fill="white" font-family="Arial" font-size="20">CI</text>
    
    <circle cx="600" cy="300" r="30" fill="#9b59b6"/>
    <text x="600" y="308" text-anchor="middle" fill="white" font-family="Arial" font-size="20">CD</text>
    
    <!-- Decorative Elements -->
    <circle cx="300" cy="400" r="20" fill="#f1c40f" opacity="0.6"/>
    <circle cx="700" cy="400" r="20" fill="#1abc9c" opacity="0.6"/>
    
    <!-- Animation Circles -->
    <circle cx="450" cy="250" r="5" fill="#3498db">
        <animate attributeName="cx" values="450;550;450" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;350;250" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="550" cy="350" r="5" fill="#e74c3c">
        <animate attributeName="cx" values="550;450;550" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="350;250;350" dur="3s" repeatCount="indefinite"/>
    </circle>
</svg>
