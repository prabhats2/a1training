            .roadmap-container {
                position: relative;
            }

                transition: all 0.3s ease;

                z-index: 1;

                z-index: 10;
                padding: 20px;
                opacity: 0;
                visibility: hidden;
            }
            .roadmap-card.expanded .skill-detail-panel {
                opacity: 1;
                visibility: visible;
            }
            .skill-badge {
                cursor: pointer;
                transition: all 0.3s ease;
                margin: 2px;
            }
            .skill-badge:hover {
                transform: scale(1.05);
                background-color: #007bff;
                color: white;
            }
            .search-container {
                max-width: 500px;
                margin: 0 auto 20px;
            }
            .roadmap-card.hidden {
                display: none;
            }
            .mobile-view {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: white;
                z-index: 1000;
            }
            .no-scroll {
                overflow: hidden;
            }
            .skill-details-panel {
                position: fixed;
                top: 20%;
                right: 5%;
                width: 350px;
                height: 60%;
                background-color: white;
                border: 1px solid #e0e0e0;
                border-radius: 10px;

                overflow-y: auto;
                z-index: 1000;
                display: none;
            }
            .skill-details-div {
                width: 100%;
                transition: all 0.3s ease;
                animation: fadeIn 0.3s ease;
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(-10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .skill-details-collapse {
                width: 100%;
                transition: all 0.3s ease;
                animation: slideDown 0.3s ease;
            }
            @keyframes slideDown {
                from { 
                    opacity: 0; 
                    max-height: 0;
                    transform: translateY(-20px);
                }
                to { 
                    opacity: 1; 
                    max-height: 300px;
                    transform: translateY(0);
                }
            }
            .beginner-level .skill-badge {
                cursor: pointer;
            }
            .skill-wrapper {
                display: inline-block;
                margin: 2px;
            }

            .skill-level {
                display: flex;
                flex-wrap: wrap;
                gap: 5px;
                align-items: flex-start;
            }

            .skill-details-div {
                width: 100%;
                margin-top: 10px;
                margin-bottom: 10px;
                display: none;
            }

            .skill-details-div.active {
                display: block;
                animation: slideDown 0.3s ease;
            }

        <script>
            function createSkillDetailHTML(skill) {
                return `
                    <div class="skill-details-div">
                        <div class="skill-details-collapse">
                            <div class="card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h5 class="card-title mb-0">${skill.name}</h5>
                                        <button class="btn btn-sm btn-outline-secondary close-details">&times;</button>
                                    </div>
                                    <img src="assets/images/road_map/${skill.image || 'default-img.png'}" 
                                        alt="${skill.name}" 
                                        class="img-fluid rounded mb-3">
                                    <p class="card-text text-muted">${skill.description || 'No description available.'}</p>
                                    ${skill.resources ? `
                                        <div class="resources-section mt-3">
                                            <h6 class="mb-2"></h6>
                                            <ul class="list-unstyled">
                                                ${skill.resources.map(resource => `
                                                    <li><a href="${resource.url}" target="_blank" class="text-primary">${resource.title}</a></li>
                                                `).join('')}
                                            </ul>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            function setupSearchFilter(container) {
                const searchInput = document.getElementById('searchInput');
                const clearSearchButton = document.getElementById('clearSearch');
                let searchTimeout;

                // Debounce function to prevent excessive filtering
                function debounce(func, delay) {
                    return function() {
                        const context = this;
                        const args = arguments;
                        clearTimeout(searchTimeout);
                        searchTimeout = setTimeout(() => func.apply(context, args), delay);
                    };
                }

                // Function to toggle clear button visibility
                function toggleClearButton() {
                    clearSearchButton.style.display = searchInput.value.trim() ? 'block' : 'none';
                }

                // Initially hide clear button
                clearSearchButton.style.display = 'none';

                // Debounced search function
                const performSearch = debounce((searchTerm) => {
                    // Reset container to original grid layout
                    container.style.gridTemplateColumns = window.innerWidth <= 768 ? '1fr' : 'repeat(3, 1fr)';
                    container.style.gap = '1rem';

                    let visibleCardsCount = 0;

                    const roadmapCards = container.querySelectorAll('.roadmap-card-wrapper');
                    roadmapCards.forEach((card, index) => {
                        // Check if the card should be shown
                        const shouldShow = 
                            // Check roadmap title
                            card.querySelector('.card-title').textContent.toLowerCase().includes(searchTerm) ||
                            
                            // Check levels
                            [...card.querySelectorAll('.text-primary')].some(levelEl => 
                                levelEl.textContent.toLowerCase().includes(searchTerm)
                            ) ||
                            
                            // Check skills
                            [...card.querySelectorAll('.skill-item')].some(skillEl => 
                                skillEl.textContent.toLowerCase().includes(searchTerm)
                            );
                        
                        // Toggle visibility and track visible cards
                        if (shouldShow) {
                            card.style.display = 'block';
                            visibleCardsCount++;

                            // Mobile layout: first visible card takes full width
                            if (window.innerWidth <= 768) {
                                if (visibleCardsCount === 1) {
                                    card.style.gridColumn = '1 / -1';
                                    card.style.width = '100%';
                                } else {
                                    card.style.gridColumn = 'auto';
                                    card.style.width = '100%';
                                }
                            }
                        } else {
                            card.style.display = 'none';
                        }
                    });

                    // Highlight matching terms
                    if (searchTerm) {
                        highlightSearchTerms(searchTerm);
                    } else {
                        removeHighlights();
                    }
                }, 250);

                // Highlight search terms in text
                function highlightSearchTerms(searchTerm) {
                    const roadmapCards = container.querySelectorAll('.roadmap-card-wrapper');
                    roadmapCards.forEach(card => {
                        if (card.style.display !== 'none') {
                            ['card-title', 'text-primary', 'skill-item'].forEach(className => {
                                card.querySelectorAll(`.${className}`).forEach(el => {
                                    const text = el.textContent;
                                    const highlightedText = text.replace(
                                        new RegExp(searchTerm, 'gi'), 
                                        match => `<mark class="search-highlight">${match}</mark>`
                                    );
                                    el.innerHTML = highlightedText;
                                });
                            });
                        }
                    });
                }

                // Remove highlights
                function removeHighlights() {
                    const highlightedElements = container.querySelectorAll('.search-highlight');
                    highlightedElements.forEach(el => {
                        el.outerHTML = el.innerHTML;
                    });
                }

                // Add event listeners for input and clear button
                searchInput.addEventListener('input', (e) => {
                    const searchTerm = e.target.value.toLowerCase().trim();
                    
                    // Toggle clear button visibility
                    toggleClearButton();
                    
                    // Perform debounced search
                    performSearch(searchTerm);
                });

                // Clear search functionality
                clearSearchButton.addEventListener('click', () => {
                    // Reset search input
                    searchInput.value = '';
                    
                    // Hide clear button
                    clearSearchButton.style.display = 'none';
                    
                    // Show all cards
                    const roadmapCards = container.querySelectorAll('.roadmap-card-wrapper');
                    roadmapCards.forEach(card => {
                        card.style.display = 'block';
                        
                        // Reset mobile layout
                        if (window.innerWidth <= 768) {
                            card.style.gridColumn = 'auto';
                            card.style.width = '100%';
                        }
                    });

                    // Remove any highlights
                    removeHighlights();

                    // Reset container layout
                    container.style.gridTemplateColumns = window.innerWidth <= 768 ? '1fr' : 'repeat(3, 1fr)';
                    
                    // Focus back on search input
                    searchInput.focus();
                });

                // Responsive layout adjustment
                function adjustMobileLayout() {
                    const roadmapCards = container.querySelectorAll('.roadmap-card-wrapper');
                    if (window.innerWidth <= 768) {
                        // Reset all cards
                        roadmapCards.forEach((card, index) => {
                            card.style.display = 'block';
                            card.style.width = '100%';
                            
                            // First card takes full width
                            if (index === 0) {
                                card.style.gridColumn = '1 / -1';
                            } else {
                                card.style.gridColumn = 'auto';
                            }
                        });
                        
                        // Set container to single column
                        container.style.gridTemplateColumns = '1fr';
                    } else {
                        // Desktop layout
                        roadmapCards.forEach((card) => {
                            card.style.gridColumn = 'auto';
                            card.style.width = '100%';
                        });
                        container.style.gridTemplateColumns = 'repeat(3, 1fr)';
                    }
                }

                // Initial layout adjustment
                adjustMobileLayout();

                // Readjust on window resize
                window.addEventListener('resize', adjustMobileLayout);
            }

            function setupSkillDetailInteraction() {
                document.addEventListener('click', function(e) {
                    const skillBadge = e.target.closest('.skill-badge');
                    if (!skillBadge) {
                        // If clicked outside a skill badge, close all details
                        document.querySelectorAll('.skill-details-div').forEach(detail => {
                            detail.remove();
                        });
                        document.querySelectorAll('.skill-badge').forEach(badge => {
                            badge.classList.remove('active');
                        });
                        document.querySelectorAll('.skill-wrapper').forEach(wrapper => {
                            wrapper.classList.remove('has-details');
                        });
                        return;
                    }

                    e.preventDefault();
                    const skillName = skillBadge.textContent.trim();
                    const wrapper = skillBadge.closest('.skill-wrapper');
                    
                    // Remove any existing open skill details
                    document.querySelectorAll('.skill-details-div').forEach(detail => {
                        detail.remove();
                    });
                    
                    // Remove active class from all badges and wrappers
                    document.querySelectorAll('.skill-badge').forEach(badge => {
                        badge.classList.remove('active');
                    });
                    document.querySelectorAll('.skill-wrapper').forEach(w => {
                        w.classList.remove('has-details');
                    });
                    
                    // If clicking the same skill that's already open, just close it
                    if (skillBadge.classList.contains('active')) {
                        skillBadge.classList.remove('active');
                        wrapper.classList.remove('has-details');
                        return;
                    }
                    
                    // Add active class to clicked badge and wrapper
                    skillBadge.classList.add('active');
                    wrapper.classList.add('has-details');
                    
                    // Create and insert the skill details after the badge
                    const detailsHTML = createSkillDetailHTML({ 
                        name: skillName,
                        description: skillBadge.getAttribute('data-description'),
                        image: skillBadge.getAttribute('data-image'),
                        resources: [] // Add resources if available in your data
                    });
                    
                    // Insert the details right after the badge
                    skillBadge.insertAdjacentHTML('afterend', detailsHTML);
                    
                    // Show the details with animation
                    const newDetails = wrapper.querySelector('.skill-details-div');
                    requestAnimationFrame(() => {
                        newDetails.classList.add('active');
                    });

                    // Add close button functionality
                    const closeButton = newDetails.querySelector('.close-details');
                    if (closeButton) {
                        closeButton.addEventListener('click', () => {
                            newDetails.remove();
                            skillBadge.classList.remove('active');
                            wrapper.classList.remove('has-details');
                        });
                    }
                });
            }

            document.addEventListener('DOMContentLoaded', async () => {
                setupSkillDetailInteraction();

                const response = await fetch('assets/json/roadmap.json');
                const data = await response.json();
                const container = document.getElementById('roadmapsContainer');

                data.roadmaps.forEach(roadmap => {
                    const roadmapCard = document.createElement('div');
                    roadmapCard.className = 'col-md-4 roadmap-card-wrapper';
                    roadmapCard.innerHTML = `
                        <div class="card roadmap-card h-100">
                            <div class="card-body position-relative">
                                ${roadmap.image ? `<img src="assets/images/road_map/${roadmap.image}" class="img-fluid rounded mb-3">` : ''}
                                <h3 class="card-title">${roadmap.title}</h3>
                                <p class="card-text">${roadmap.description}</p>
                                ${roadmap.levels.map(level => `
                                    <div class="mb-3 ${level.level.toLowerCase()}-level">
                                        <h5 class="text-primary">${level.level} Level</h5>
                                        <div class="skill-level">
                                            ${level.skills.map(skillName => {
                                                const skill = typeof skillName === 'string' ? { name: skillName } : skillName;
                                                return `
                                                    <div class="skill-wrapper">
                                                        <span class="skill-badge badge bg-light text-dark skill-item" 
                                                            data-skill="${skill.name}"
                                                            data-description="${skill.description || 'No additional details available.'}"
                                                            data-image="${skill.image || ''}"
                                                            title="${skill.description || 'No additional details available.'}">
                                                            ${skill.name}
                                                        </span>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                    container.appendChild(roadmapCard);
                });

                // Setup search filter
                setupSearchFilter(container);
            });

            // Voice Function For Search Bar
                
        document.addEventListener('DOMContentLoaded', async () => {
        setupSkillDetailInteraction();

        // Add Voice Search Functionality
        if ('webkitSpeechRecognition' in window) {
            const recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            const voiceSearchBtn = document.getElementById('voiceSearch');
            const searchInput = document.getElementById('searchInput');

            voiceSearchBtn.addEventListener('click', () => {
                if (voiceSearchBtn.classList.contains('listening')) {
                    recognition.stop();
                    voiceSearchBtn.classList.remove('listening', 'text-danger');
                } else {
                    recognition.start();
                    voiceSearchBtn.classList.add('listening', 'text-danger');
                }
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                searchInput.value = transcript;
                searchInput.dispatchEvent(new Event('input'));
                voiceSearchBtn.classList.remove('listening', 'text-danger');
            };

            recognition.onerror = (event) => {
                console.error('Voice recognition error:', event.error);
                voiceSearchBtn.classList.remove('listening', 'text-danger');
            };

            recognition.onend = () => {
                voiceSearchBtn.classList.remove('listening', 'text-danger');
            };
        } else {
            const voiceSearchBtn = document.getElementById('voiceSearch');
            if (voiceSearchBtn) {
                voiceSearchBtn.style.display = 'none';
            }
        }

        // Rest of your existing code
        const response = await fetch('assets/json/roadmap.json');
        const data = await response.json();
        const container = document.getElementById('roadmapsContainer');

        // ... (keep your existing roadmap card creation code) ...

        // Setup search filter
        setupSearchFilter(container);
    });


            /// Number count in hero section 
            
                        document.addEventListener('DOMContentLoaded', function() {
                            const counters = document.querySelectorAll('.counter');
                            
                            const animateCounter = (element, target) => {
                                let current = 0;
                                const increment = target / 200; // Adjust speed by changing divider
                                const updateCounter = () => {
                                    current += increment;
                                    if(current < target) {
                                        element.textContent = Math.ceil(current);
                                        requestAnimationFrame(updateCounter);
                                    } else {
                                        element.textContent = target;
                                    }
                                };
                                requestAnimationFrame(updateCounter);
                            };
                        
                            const observer = new IntersectionObserver((entries) => {
                                entries.forEach(entry => {
                                    if(entry.isIntersecting) {
                                        const target = +entry.target.dataset.target;
                                        animateCounter(entry.target, target);
                                        observer.unobserve(entry.target);
                                    }
                                });
                            }, { threshold: 0.5 }); // Start animation when 50% visible
                        
                            counters.forEach(counter => {
                                observer.observe(counter);
                            });
                        });
        </script>
